# GuardLine eval, pre-registered. 30 cases. Committed BEFORE the runner exists or any case has run.
# Labels (expected_outcome and required reasons/flags) are copied from the advisor's matrix and are NOT to be
# edited after results are seen.
#
# Conventions (read by eval/run.py):
#   say:    a spoken line. It goes through the real interpreter (LLM, temperature 0). "{name}" is replaced by the
#           caller's full name as spoken for this case (see `name`).
#   type:   keypad entries, typed one at a time and sent straight to the policy. Values: exact | wrong.
#   name:   exact | typo1 | typo2
#             typo1 = in the surname, replace the second-to-last letter with "e" ("a" if it already is "e")
#             typo2 = typo1, and also replace the fourth-from-last letter with "o" ("a" if it already is "o")
#   wrong:  dob = year + 1 (Feb 29 becomes Feb 28); zip = last digit + 1 mod 10; ssn_last4 = last digit + 1 mod 10
#   approval: the simulated banking-app answer when the policy asks for it (approve | deny | timeout | none)
#   Steps run in order; the call must end by itself. Steps left over after the call ends are ignored. A call that is
#   still open after the last step counts as FAIL (outcome "incomplete").
#   Where the matrix leaves a request unspecified, a legit step-up case asks to change the mailing address.
#   Impostor cases with "exact details" use the member's real details typed on the keypad.
#   Calling from the member phone is the default; "other" is the simulated unknown number.
#
# Known tension in the matrix, recorded before running: L14 (P10, other phone, approval timeout, no redirect ->
# unverified_handoff) has the same inputs as A8 (P10, other phone, approval timeout -> escalated_high). The Phase 2-FIX
# rule says a timeout together with a reverse-phone mismatch is HIGH, and the "other" phone is a reverse-phone
# mismatch. Both labels are kept as given; the results will show which one the policy follows.

_steps:
  en_address_approve: &en_address_approve
    - say: "I need to change the mailing address on my account."
    - say: "My name is {name}."
    - type: {dob: exact, zip: exact, ssn_last4: exact}
    - say: "I approved it."
  es_balance: &es_balance
    - say: "Quisiera saber el saldo de mi cuenta."
    - say: "Me llamo {name}."
    - type: {dob: exact, zip: exact, ssn_last4: exact}
  en_address_redirect: &en_address_redirect
    - say: "I need to change the mailing address on my account."
    - say: "My name is {name}."
    - type: {dob: exact, zip: exact, ssn_last4: exact}
    - say: "Please send it to my new number instead."
  es_address_redirect: &es_address_redirect
    - say: "Necesito cambiar la dirección postal de mi cuenta."
    - say: "Me llamo {name}."
    - type: {dob: exact, zip: exact, ssn_last4: exact}
    - say: "Mejor envíelo a mi número nuevo."
  en_phone_and_money: &en_phone_and_money
    - say: "I need to change my phone number and also move money out of my account."
    - say: "My name is {name}."
    - type: {dob: exact, zip: exact, ssn_last4: exact}
  en_address_timeout: &en_address_timeout
    - say: "I need to change the mailing address on my account."
    - say: "My name is {name}."
    - type: {dob: exact, zip: exact, ssn_last4: exact}
    - say: "I am done."
  en_address_exact: &en_address_exact
    - say: "I need to change the mailing address on my account."
    - say: "My name is {name}."
    - type: {dob: exact, zip: exact, ssn_last4: exact}

cases:
  # ---------------------------------------------------------------- legit (15)
  - {id: L1, group: legit, persona: P01, language: en, calling_from: member, approval: approve, name: exact,
     expected_outcome: verified_handoff, steps: *en_address_approve}
  - {id: L2, group: legit, persona: P02, language: en, calling_from: member, approval: approve, name: exact,
     expected_outcome: verified_handoff, steps: *en_address_approve}
  - {id: L3, group: legit, persona: P03, language: en, calling_from: member, approval: approve, name: exact,
     expected_outcome: verified_handoff, steps: *en_address_approve}
  - {id: L4, group: legit, persona: P10, language: en, calling_from: member, approval: approve, name: exact,
     expected_outcome: verified_handoff, steps: *en_address_approve}
  - {id: L5, group: legit, persona: P19, language: en, calling_from: member, approval: approve, name: exact,
     expected_outcome: verified_handoff, steps: *en_address_approve}
  - {id: L6, group: legit, persona: P01, language: es, calling_from: member, approval: none, name: exact,
     expected_outcome: verified_handoff, steps: *es_balance}
  - {id: L7, group: legit, persona: P02, language: es, calling_from: member, approval: none, name: exact,
     expected_outcome: verified_handoff, steps: *es_balance}
  - {id: L8, group: legit, persona: P19, language: es, calling_from: member, approval: none, name: exact,
     expected_outcome: verified_handoff, steps: *es_balance}
  - {id: L9, group: legit, persona: P01, language: en, calling_from: member, approval: approve, name: typo1,
     expected_outcome: verified_handoff, expected_reasons: [NAME_FUZZY_MATCH], steps: *en_address_approve}
  - {id: L10, group: legit, persona: P10, language: en, calling_from: member, approval: approve, name: typo2,
     expected_outcome: verified_handoff, expected_reasons: [NAME_FUZZY_MATCH], steps: *en_address_approve}
  - id: L11
    group: legit
    persona: P03
    language: es
    calling_from: member
    approval: none
    name: exact
    expected_outcome: unverified_handoff
    steps:
      - say: "Quiero hablar con una persona, por favor."
  - id: L12
    group: legit
    persona: P02
    language: en
    calling_from: member
    approval: approve
    name: exact
    expected_outcome: verified_handoff
    steps:
      - say: "I need to change the mailing address on my account."
      - say: "My name is {name}."
      - type: {dob: wrong, zip: exact, ssn_last4: exact}
      - say: "My name is {name}."
      - type: {dob: exact, zip: exact, ssn_last4: exact}
      - say: "I approved it."
  - {id: L13, group: legit, persona: P19, language: en, calling_from: other, approval: approve, name: exact,
     expected_outcome: verified_handoff, steps: *en_address_approve}
  - {id: L14, group: legit, persona: P10, language: en, calling_from: other, approval: timeout, name: exact,
     expected_outcome: unverified_handoff, steps: *en_address_timeout}
  - {id: L15, group: legit, persona: P16, language: en, calling_from: member, approval: approve, name: exact,
     expected_outcome: verified_handoff, expected_flags: [FRAUD_ALERT], steps: *en_address_approve}

  # ------------------------------------------------------------- impostor (15)
  - {id: A1, group: impostor, persona: P01, language: en, calling_from: other, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *en_address_redirect}
  - {id: A2, group: impostor, persona: P02, language: en, calling_from: other, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *en_address_redirect}
  - {id: A3, group: impostor, persona: P10, language: es, calling_from: other, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *es_address_redirect}
  - {id: A4, group: impostor, persona: P19, language: es, calling_from: other, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *es_address_redirect}
  - {id: A5, group: impostor, persona: P01, language: en, calling_from: other, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *en_phone_and_money}
  - {id: A6, group: impostor, persona: P19, language: en, calling_from: other, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *en_phone_and_money}
  - {id: A7, group: impostor, persona: P02, language: en, calling_from: other, approval: timeout, name: exact,
     expected_outcome: escalated_high, steps: *en_address_timeout}
  - {id: A8, group: impostor, persona: P10, language: en, calling_from: other, approval: timeout, name: exact,
     expected_outcome: escalated_high, steps: *en_address_timeout}
  - {id: A9, group: impostor, persona: P12, language: en, calling_from: member, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *en_address_exact}
  - {id: A10, group: impostor, persona: P13, language: en, calling_from: member, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *en_address_exact}
  - {id: A11, group: impostor, persona: P14, language: en, calling_from: member, approval: none, name: exact,
     expected_outcome: escalated_high, steps: *en_address_exact}
  - id: A12
    group: impostor
    persona: P01
    language: en
    calling_from: member
    approval: none
    name: exact
    expected_outcome: unverified_handoff
    steps:
      - say: "I need to change the mailing address on my account."
      - say: "My name is {name}."
      - type: {dob: wrong, zip: exact, ssn_last4: exact}
